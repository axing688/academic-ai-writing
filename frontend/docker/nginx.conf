# 前端容器内 nginx 配置：静态资源 + 后端 API + LLM 动态代理
# LLM 代理与开发环境一致：前端请求 /llm/<provider>/... 并携带 X-AWA-Target 头
# （头中的地址为各服务商官方 API 地址，由前端固定写入）

# LLM 服务商路由表
map $uri $llm_upstream_path {
    ~^/llm/[^/]+(/.*)$ $1;
    default /;
}

server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # LLM 多服务商动态代理
    location /llm/ {
        resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        # 依据请求头 X-AWA-Target（官方 API Base URL）转发
        proxy_pass $http_x_awa_target$llm_upstream_path;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
